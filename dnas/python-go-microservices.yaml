id: python-go-microservices
name: Python/Go Microservices DNA
version: '1.0.0'
description: |
  Governance DNA for a polyglot microservices architecture (Python and/or Go
  services communicating over gRPC/REST). Protects service boundaries, treats
  shared contracts (protobuf/OpenAPI schemas) as high-risk changes, and adds
  canary-deployment and incident-response patterns suited to distributed systems.
author: BehaviorOS Team
license: MIT
tags:
  - python
  - go
  - microservices
  - distributed-systems

personas:
  - role: architect
    authority: architect
    name: Distributed Systems Architect
    description: >-
      Owns service boundaries, shared contracts (protobuf/OpenAPI), and
      cross-service data-consistency decisions.
    boundaries:
      - id: arch-max-modules
        name: Max services touched per change
        type: max_modules
        value: 2
        scope: per_pr
      - id: arch-require-adr
        name: Require ADR for new service boundaries
        type: require_approval
        value: true
        scope: per_commit
    skills:
      - distributed-systems-design
      - service-boundary-design
      - protobuf-schema-design
    tools:
      - read
      - write
      - architecture-diagram

  - role: engineer
    authority: senior
    name: Service Owner
    description: >-
      Owns one or more services end-to-end. Must not directly access another
      service's internal package/module or its private datastore.
    boundaries:
      - id: svc-no-cross-service-internals
        name: No direct access to another service's internals
        type: forbidden
        value: 'services/*/internal/**'
        scope: global
      - id: svc-no-cross-service-db
        name: No direct access to another service's database
        type: forbidden
        value: 'services/*/db/**'
        scope: global
      - id: svc-max-files
        name: Max files per change
        type: max_files
        value: 12
        scope: per_pr
      - id: svc-require-review
        name: Require code review
        type: require_approval
        value: true
        scope: per_pr
    skills:
      - go
      - python
      - grpc
      - rest-api-design
      - database-design
    tools:
      - read
      - write
      - test-runner
      - linter

  - role: qa
    authority: senior
    name: Contract & Reliability QA
    description: Owns contract tests between services and reliability/SLO validation.
    boundaries:
      - id: qa-min-coverage
        name: Minimum test coverage
        type: max_lines
        value: 75
        scope: per_pr
      - id: qa-require-contract-tests
        name: Require contract tests for schema changes
        type: require_approval
        value: true
        scope: per_commit
    skills:
      - contract-testing
      - chaos-testing
      - performance-testing
    tools:
      - read
      - write
      - test-runner
      - coverage-report

  - role: security
    authority: architect
    name: Security Architect
    description: Reviews service-to-service auth (mTLS, JWT) and dependency security.
    boundaries:
      - id: sec-no-secrets
        name: No secrets in code
        type: forbidden
        value: true
        scope: global
      - id: sec-review-service-auth
        name: Review service-to-service auth changes
        type: require_approval
        value: true
        scope: per_commit
    skills:
      - security-review
      - mtls
      - dependency-audit
    tools:
      - read
      - write
      - security-scanner

  - role: devops
    authority: senior
    name: SRE / Platform Engineer
    description: >-
      Manages the service mesh, CI/CD, canary rollouts, and infrastructure
      for all services.
    boundaries:
      - id: ops-no-prod-direct
        name: No direct prod access
        type: forbidden
        value: true
        scope: global
      - id: ops-require-change-request
        name: Require change request for infra/mesh changes
        type: require_approval
        value: true
        scope: per_commit
    skills:
      - kubernetes
      - service-mesh
      - ci-cd
      - observability
    tools:
      - read
      - write
      - kubernetes
      - terraform

  - role: orchestrator
    authority: lead
    name: Orchestrator
    description: >-
      Central coordinator. MUST delegate all execution work to the appropriate
      service owner. CANNOT edit files directly.
    boundaries:
      - id: orch-no-direct-edit
        name: No direct file editing
        type: forbidden
        value: true
        scope: global
      - id: orch-must-delegate
        name: Must delegate via Task tool
        type: require_approval
        value: true
        scope: per_session
    skills:
      - delegation
      - mission-management
    tools:
      - task-delegation
      - behavioros-mcp

governance:
  - id: gov-contract-breaking-change
    name: Shared Contract Breaking Change
    description: >-
      Changes to shared protobuf/OpenAPI schemas require architect approval —
      other services depend on them at build and runtime.
    level: critical
    action: escalate
    conditions:
      - type:contract
      - type:schema

  - id: gov-service-boundary
    name: Service Boundary
    description: Services must not directly import or query another service's internals/database.
    level: critical
    action: block
    conditions:
      - type:cross-service-access

  - id: gov-service-mesh-change
    name: Service Mesh / Infra Change
    description: Service mesh and infrastructure changes require SRE approval
    level: medium
    action: escalate
    conditions:
      - type:infrastructure
      - type:service-mesh

  - id: gov-quality-gate
    name: Quality Gate
    description: Features and bugfixes must pass quality gates before merge
    level: medium
    action: warn
    conditions:
      - type:feature
      - type:bugfix

  - id: gov-orchestrator-no-direct-execution
    name: Orchestrator Must Not Execute Directly
    description: Orchestrator must delegate all implementation work to a service owner.
    level: critical
    action: block
    conditions:
      - type:orchestrator-direct-execution
      - type:edit-code

quality:
  - id: qg-test-coverage
    name: Test Coverage
    description: Minimum test coverage threshold per service
    type: test_coverage
    threshold: 75

  - id: qg-lint
    name: Lint Check
    description: Code must pass linting (golangci-lint / ruff)
    type: lint
    pass: true

  - id: qg-typecheck
    name: Static Type Check
    description: Code must pass static analysis (go vet / mypy)
    type: typecheck
    pass: true

  - id: qg-security-scan
    name: Security Scan
    description: No critical vulnerabilities in service dependencies
    type: security
    pass: true

  - id: qg-latency-slo
    name: Latency SLO
    description: p99 latency must stay within the service's declared SLO
    type: performance
    threshold: 90

patterns:
  - id: pat-contract-review
    name: Contract Review
    type: review
    description: Any change to a shared schema must be reviewed by the architect and all consuming services' owners
    triggers:
      - agent:service-owner
    actions:
      - propose-schema-change
      - review-consumer-impact
      - approve-or-reject
      - version-schema
    conditions:
      - type:contract
      - type:schema

  - id: pat-canary-release
    name: Canary Release
    type: deployment
    description: Progressive rollout with automatic rollback on SLO breach
    triggers:
      - agent:devops
    actions:
      - deploy-canary
      - monitor-slo
      - promote-or-rollback
      - deploy-full
    conditions:
      - type:release

  - id: pat-incident-response
    name: Incident Response
    type: escalation
    description: Structured incident response across affected services
    triggers:
      - agent:sre
      - agent:security
    actions:
      - detect-incident
      - triage
      - contain
      - eradicate
      - recover
      - post-mortem
    conditions:
      - type:incident
      - type:emergency

workflows:
  - id: wf-feature-development
    name: Feature Development
    type: action
    description: Standard feature development workflow within one service
    agent: engineer
    next:
      - wf-contract-check
    timeout: 86400000
    retries: 2

  - id: wf-contract-check
    name: Contract Check
    type: gate
    description: Verify no unapproved breaking changes to shared schemas
    agent: architect
    next:
      - wf-testing
    timeout: 3600000
    retries: 1

  - id: wf-testing
    name: Testing
    type: parallel
    description: Run unit, contract, and integration test suites
    agent: qa
    next:
      - wf-canary-deployment
    timeout: 3600000
    retries: 3

  - id: wf-canary-deployment
    name: Canary Deployment
    type: conditional
    description: Progressive rollout with SLO-gated promotion
    agent: devops
    timeout: 3600000
    retries: 1
