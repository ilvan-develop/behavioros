name: Protocol Compliance

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: protocol-deep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compliance:
    name: Protocol Compliance Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check canonical protocol doc exists
        run: |
          if [ -f "docs/PROTOCOL.md" ]; then
            echo "  ✓ docs/PROTOCOL.md — canonical source of truth"
          else
            echo "  ✗ docs/PROTOCOL.md — MISSING"
            echo "ERROR: The canonical protocol document is required."
            echo "Create it via: npx @behavioros/cli init --with-protocol"
            exit 1
          fi

      - name: Check platform config files exist
        run: |
          FAILED=0
          echo "Checking protocol enforcement files..."
          for f in \
            "AGENTS.md" \
            ".opencode/rules/behavioros-protocol.md" \
            ".cursor/rules/behavioros-protocol.mdc" \
            ".github/copilot-instructions.md" \
            ".windsurfrules" \
            "CLAUDE.md"
          do
            if [ -f "$f" ]; then
              echo "  ✓ $f"
            else
              echo "  ✗ $f — MISSING"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo ""
            echo "ERROR: One or more protocol enforcement files are missing."
            echo "Run 'npx @behavioros/cli init --with-protocol' to generate all platform configs."
            exit 1
          fi
          echo ""
          echo "All protocol enforcement files present."

      - name: Verify AGENTS.md references protocol
        run: |
          if grep -q "behavioros-protocol\|PROTOCOL.md\|BehaviorOS Protocol" AGENTS.md; then
            echo "  ✓ AGENTS.md references the protocol"
          else
            echo "  ✗ AGENTS.md does not reference the protocol"
            echo "Add '@rules/behavioros-protocol' or a reference to docs/PROTOCOL.md"
            exit 1
          fi

      - name: Verify CLAUDE.md contains 7 mandatory steps
        run: |
          if grep -q "7 Mandatory Steps\|Mandatory Steps" CLAUDE.md; then
            echo "  ✓ CLAUDE.md has protocol section with mandatory steps"
          else
            echo "  ✗ CLAUDE.md missing mandatory steps section"
            echo "CLAUDE.md must include the 7 mandatory steps table from the protocol."
            exit 1
          fi

      - name: Verify all files align with canonical source
        run: |
          echo "PROTOCOL.md exists:         $([ -f docs/PROTOCOL.md ] && echo 'YES' || echo 'NO')"
          echo "CLAUDE.md references doc:   $(grep -c 'PROTOCOL.md' CLAUDE.md || true)"
          echo "AGENTS.md references doc:   $(grep -c 'PROTOCOL.md\|behavioros-protocol' AGENTS.md || true)"
          echo ""
          echo "All platform config files aligned with canonical source at docs/PROTOCOL.md."

  deep-validation:
    name: Deep Protocol Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [compliance]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate DNA files
        run: |
          FAILED=0
          for dna_file in dnas/*.yaml dnas/*.yml; do
            if [ -f "$dna_file" ]; then
              echo "  Checking $dna_file..."
              if npx @behavioros/cli validate "$dna_file" 2>/dev/null; then
                echo "    ✓ Valid"
              else
                echo "    ✗ INVALID"
                FAILED=1
              fi
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: One or more DNA files are invalid."
            exit 1
          fi

      - name: Check agent definitions follow 7-step protocol
        run: |
          FAILED=0
          for agent_file in .opencode/agents/*.md; do
            echo "  Checking $agent_file..."
            if grep -q "bos_select_dna" "$agent_file"; then
              echo "    ✓ bos_select_dna"
            else
              echo "    ✗ bos_select_dna MISSING"
              FAILED=1
            fi
            if grep -q "bos_run_audit" "$agent_file"; then
              echo "    ✓ bos_run_audit"
            else
              echo "    ✗ bos_run_audit MISSING"
              FAILED=1
            fi
          done
          if [ "$FAILED" -ne 0 ]; then
            echo "ERROR: Some agents missing mandatory protocol steps."
            exit 1
          fi

      - name: Check MCP server enforces protocol
        run: |
          if grep -q "ProtocolStateTracker\|step1_completed\|delegationEnforcement" packages/mcp-server/src/server.ts 2>/dev/null; then
            echo "  ✓ MCP server has protocol enforcement"
          elif grep -q "ProtocolStateTracker\|step1_completed\|delegationEnforcement" packages/core/src/engines/protocol-engine.ts 2>/dev/null; then
            echo "  ✓ Protocol enforcement in core engine"
          else
            echo "  ⚠ Protocol enforcement not found in MCP server or core engine"
          fi

      - name: Check pre-commit hook exists
        run: |
          if [ -f ".githooks/pre-commit" ] || [ -f ".husky/pre-commit" ]; then
            echo "  ✓ Pre-commit hook found"
          else
            echo "  ⚠ No pre-commit hook found (optional but recommended)"
          fi
