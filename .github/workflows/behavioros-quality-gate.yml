name: BehaviorOS Quality Gate

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core packages
        run: pnpm build

      - name: Build CLI
        run: pnpm --filter @behavioros/cli build

      - name: Protocol compliance check
        run: node packages/cli/dist/bin.mjs protocol check

      - name: DNA validate
        run: node packages/cli/dist/bin.mjs validate dnas/enterprise-governance.yaml

      - name: Block merge on failure
        if: failure()
        run: |
          echo "::error::Quality gate failed — protocol or DNA validation did not pass."
          exit 1
