version: '3.8'
services:
  behavioros-mcp:
    build: .
    container_name: behavioros-mcp
    ports:
      - "3000:3000"
    environment:
      - BEHAVIOROS_DNA_PATH=/app/dnas/enterprise-governance.yaml
      - BEHAVIOROS_PROJECT=behavioros
      - NODE_ENV=production
    volumes:
      - behavioros-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: echo '{"jsonrpc":"2.0","id":1,"method":"resources/list","params":{}}' | nc -w 2 localhost 3000 || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  behavioros-data:
